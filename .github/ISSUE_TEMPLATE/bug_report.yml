name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials.** Nothing from `~/.crossagent/` — `token`, `dashboard-token`,
        `agent-*-token`, `capture-*`, `inject-*`, a session ticket, or the database. Paths, byte
        lengths, HTTP status codes and error shapes are what actually diagnose this.

        A vulnerability is not a bug report. Use
        [private reporting](https://github.com/ayanamislover/ayanamiAgent-Hub/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/ayanamislover/ayanamiAgent-Hub/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, in order. Say whether the data directory was fresh.
      placeholder: |
        1. pnpm crossagent start
        2. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Environment
      description: >-
        Paste the output of `pnpm crossagent doctor`. It reports OS, Node, pnpm, git, codex and
        claude versions, and Hub health — it does not print any credential, only whether one is
        present.
      render: json
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Portable win-x64 zip
        - Clone plus scripts/install.ps1
        - Clone plus Start-CrossAgent-Hub.cmd
        - Clone plus pnpm install / pnpm build
        - Other
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Which Adapter is involved
      options:
        - Codex Bridge
        - Claude native Channel
        - Claude hook fallback
        - None / Hub or Dashboard only
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: >-
        From `~/.crossagent/hub.log`. Excerpt the lines around the failure rather than attaching the
        whole file, and check them for anything you would not post publicly.
      render: text
