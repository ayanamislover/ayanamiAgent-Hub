name: CI

# Windows is the supported platform (see README "Platform support"), so the gate that decides
# whether a change is good runs there. The macOS and Linux branches in the code are not covered
# here, which matches how honestly they are described in the README.
#
# The work is layered by what it can tell you. A pull request pays for the checks that decide
# whether the change is correct. Pushing to main additionally pays for the ones that need a running
# Hub. Slow, environmental work lives in nightly.yml, and everything a downloaded artifact has to
# survive lives in release.yml. A change that only touches prose skips all of it except the two
# checks that can still fail on prose.
#
# Actions are pinned to a commit rather than a tag: a tag is mutable, and these run with the
# repository checked out.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push now only listens to main. A branch pushed inside this repository and then opened as a pull
# request used to start two identical runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    # Decides which files changed. It runs no project code, so it does not need the supported
    # platform, and a Linux runner starts in a fraction of the time.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Anything that is not clearly prose is treated as code, including an unresolvable base.
          # The failure mode of guessing wrong here is a change that skipped the gate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "changed files:"
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Repository hygiene is what can still fail on prose: a credential written into a URL, a local
      # machine path, a relative link that no longer resolves.
      - name: Lint
        run: pnpm lint

  verify:
    name: Verify
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads the version straight from the `packageManager` field, so the pin has one home. Not
      # Corepack: the copy bundled with Node carries npm signing keys that no longer verify
      # ("Cannot find matching keyid"), and it fails before it ever reads the pin.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # The exact floor package.json declares, so that the declared minimum is the version actually
      # proven to work rather than whatever happens to be current.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Runs the repository hygiene script before ESLint.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The root release build. Component packages refuse to build unless this holds the BUILD lock.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Everything below needs a Hub that actually starts, which is the part a pull request does not
      # pay for.
      - name: Command-line smoke
        if: github.event_name != 'pull_request'
        run: pnpm smoke:cli

      - name: Review gate smoke
        if: github.event_name != 'pull_request'
        run: pnpm smoke:review

      # Seeds a clean data directory by enrolling both Adapters through the real ticket flow, so it
      # depends on nothing left over from an earlier run. Needs the build above: the suite starts the
      # Hub from apps/hub/dist and serves apps/dashboard/dist.
      - name: Install Playwright browsers
        if: github.event_name != 'pull_request'
        run: pnpm --filter @crossagent/dashboard exec playwright install --with-deps chromium

      - name: End-to-end
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e

      - name: Upload end-to-end failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: output/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
