packages:
  - "apps/*"
  - "packages/*"

# tsup pins esbuild to ^0.27.0, which keeps a copy carrying GHSA "arbitrary file read when running
# the development server on Windows" -- reachable only through `esbuild serve`, which nothing here
# starts. It is still a reported advisory against this repository, and tsup only ever asks bundle
# APIs of it, so both copies are pinned forward to the patched line instead.
overrides:
  esbuild: "^0.28.1"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Microsoft's PTY bindings, the same ones VS Code uses. A real pseudo-terminal is the point of
  # the console: piped stdio would give the agent CLIs no TTY, so they would drop their
  # interactive modes. Its install script compiles the native addon, hence the explicit approval.
  node-pty: true
